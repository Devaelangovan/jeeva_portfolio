<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>
    
    <radialGradient id="rimLight" cx="75%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1E3A8A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="faceLight" cx="45%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Texture -->
  <rect width="800" height="1000" fill="url(#dotGrid)"/>

  <!-- Dramatic Studio Backlight Glow -->
  <circle cx="580" cy="320" r="320" fill="url(#rimLight)"/>
  <circle cx="360" cy="400" r="300" fill="url(#faceLight)"/>

  <!-- Cinematic Framing Viewfinder Overlays -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.4">
    <!-- Viewfinder Corners -->
    <path d="M 40 80 L 40 40 L 80 40" fill="none"/>
    <path d="M 720 40 L 760 40 L 760 80" fill="none"/>
    <path d="M 40 920 L 40 960 L 80 960" fill="none"/>
    <path d="M 720 960 L 760 960 L 760 920" fill="none"/>
    
    <!-- Rule of thirds lines (subtle) -->
    <line x1="266" y1="40" x2="266" y2="960" stroke="#1E293B" stroke-dasharray="4 6"/>
    <line x1="533" y1="40" x2="533" y2="960" stroke="#1E293B" stroke-dasharray="4 6"/>
    <line x1="40" y1="333" x2="760" y2="333" stroke="#1E293B" stroke-dasharray="4 6"/>
    <line x1="40" y1="666" x2="760" y2="666" stroke="#1E293B" stroke-dasharray="4 6"/>
    
    <!-- Center Target Crosshair -->
    <line x1="390" y1="500" x2="410" y2="500"/>
    <line x1="400" y1="490" x2="400" y2="510"/>
  </g>

  <!-- Stylized Cinematic Silhouette of Creative Director -->
  <g id="directorSilhouette">
    <!-- Soft Studio Rim Contour -->
    <path d="M 400 210 
             C 330 210, 270 250, 260 340 
             C 255 385, 275 440, 310 475 
             C 285 510, 210 560, 160 620 
             C 120 670, 95 750, 80 880 
             L 720 880 
             C 705 750, 680 670, 640 620 
             C 590 560, 515 510, 490 475 
             C 525 440, 545 385, 540 340 
             C 530 250, 470 210, 400 210 Z" 
          fill="#0B132B" opacity="0.95"/>

    <!-- Sharp Blue Rim Highlight on Head & Shoulders -->
    <path d="M 400 210 
             C 470 210, 530 250, 540 340 
             C 545 385, 525 440, 490 475 
             C 515 510, 590 560, 640 620 
             C 680 670, 705 750, 720 880 
             L 700 880 
             C 685 760, 660 680, 620 635 
             C 575 580, 500 530, 475 490 
             C 510 450, 525 390, 520 345 
             C 510 270, 460 225, 400 220 Z" 
          fill="url(#neonCyan)" opacity="0.75"/>

    <!-- Head & Hair Silhouette -->
    <path d="M 330 330 Q 310 270 360 235 Q 400 215 445 230 Q 480 250 470 300 Q 485 330 460 360 C 445 380, 435 410, 400 425 C 365 410, 355 380, 340 360 Z" 
          fill="#070D1A"/>

    <!-- Director's Over-Ear Studio Headphones -->
    <g id="studioHeadphones" stroke="#38BDF8" stroke-width="2" fill="none">
      <!-- Headband Arc -->
      <path d="M 305 320 C 300 220, 500 220, 495 320" stroke-width="6" stroke="#1E293B"/>
      <path d="M 305 320 C 300 220, 500 220, 495 320" stroke-width="2" stroke="#38BDF8" opacity="0.8"/>
      <!-- Left Ear Cup -->
      <rect x="290" y="315" width="24" height="50" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <rect x="284" y="325" width="8" height="30" rx="3" fill="#38BDF8" opacity="0.9"/>
      <!-- Right Ear Cup -->
      <rect x="486" y="315" width="24" height="50" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <rect x="508" y="325" width="8" height="30" rx="3" fill="#38BDF8" opacity="0.9"/>
    </g>

    <!-- Collar & Jacket Lines -->
    <path d="M 355 520 L 400 620 L 445 520" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
    <path d="M 400 620 L 400 880" stroke="#1E293B" stroke-width="2"/>
    <path d="M 330 550 L 260 880" stroke="#1E293B" stroke-width="1.5"/>
    <path d="M 470 550 L 540 880" stroke="#1E293B" stroke-width="1.5"/>
  </g>

  <!-- Technical Telecine & Broadcast Metadata Overlay -->
  <g font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="12" fill="#94A3B8">
    <!-- Top Metadata Bar -->
    <rect x="50" y="55" width="700" height="34" rx="4" fill="#070B14" fill-opacity="0.85" stroke="#1E293B" stroke-width="1"/>
    
    <!-- REC Indicator -->
    <circle cx="75" cy="72" r="5" fill="#EF4444"/>
    <text x="88" y="76" font-weight="700" fill="#EF4444" letter-spacing="1.5">LIVE</text>
    <text x="140" y="76" fill="#64748B">|</text>
    <text x="160" y="76" fill="#F8FAFC" font-weight="600">DIR: JEEVAN V</text>
    <text x="290" y="76" fill="#64748B">|</text>
    <text x="310" y="76" fill="#38BDF8">CAM-A [4K UHD]</text>
    <text x="460" y="76" fill="#64748B">|</text>
    <text x="480" y="76" fill="#F8FAFC">24.00 FPS</text>
    <text x="560" y="76" fill="#64748B">|</text>
    <text x="580" y="76" fill="#38BDF8" font-weight="700">01:00:24:18</text>

    <!-- Bottom Director Slate Card -->
    <g transform="translate(60, 810)">
      <rect width="680" height="130" rx="8" fill="#070B14" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="8" height="130" rx="4" fill="#38BDF8"/>
      
      <text x="30" y="35" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="0.5">JEEVAN V</text>
      <text x="30" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" fill="#38BDF8" letter-spacing="2">CREATIVE DIRECTOR &amp; SHOW PRODUCER</text>
      
      <text x="30" y="95" font-size="11" fill="#94A3B8">SPECIALIZATION:</text>
      <text x="145" y="95" font-size="11" fill="#F8FAFC" font-weight="600">TELEVISION • REALITY FORMATS • SCRIPT &amp; LIVE CONTROL ROOM</text>
      
      <text x="30" y="115" font-size="11" fill="#94A3B8">BASE LOCATION:</text>
      <text x="145" y="115" font-size="11" fill="#F8FAFC" font-weight="600">CHENNAI, INDIA • TAMIL &amp; ENGLISH</text>

      <!-- Lens / Frame Calibration mark -->
      <g transform="translate(560, 25)">
        <circle cx="45" cy="40" r="32" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="45" cy="40" r="16" fill="none" stroke="#60A5FA" stroke-width="1"/>
        <line x1="45" y1="4" x2="45" y2="76" stroke="#38BDF8" stroke-width="1"/>
        <line x1="9" y1="40" x2="81" y2="40" stroke="#38BDF8" stroke-width="1"/>
        <text x="45" y="86" font-size="9" text-anchor="middle" fill="#64748B">ASPECT 2.39:1</text>
      </g>
    </g>
  </g>
</svg>