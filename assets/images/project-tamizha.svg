<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0A1124"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <radialGradient id="stageSpotlight1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="stageSpotlight2" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="screenGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <linearGradient id="culinaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="1200" height="700" fill="url(#studioBg)"/>
  
  <!-- Studio Spotlights -->
  <circle cx="360" cy="180" r="400" fill="url(#stageSpotlight1)"/>
  <circle cx="840" cy="180" r="400" fill="url(#stageSpotlight2)"/>

  <!-- Overhead Studio Lighting Truss Grid -->
  <g stroke="#334155" stroke-width="2" opacity="0.6">
    <line x1="100" y1="40" x2="1100" y2="40"/>
    <line x1="100" y1="70" x2="1100" y2="70"/>
    <path d="M 120 40 L 140 70 L 160 40 L 180 70 L 200 40 L 220 70 L 240 40 L 260 70 L 280 40 L 300 70 L 320 40 L 340 70 L 360 40 L 380 70 L 400 40 L 420 70 L 440 40 L 460 70 L 480 40 L 500 70 L 520 40 L 540 70 L 560 40 L 580 70 L 600 40 L 620 70 L 640 40 L 660 70 L 680 40 L 700 70 L 720 40 L 740 70 L 760 40 L 780 70 L 800 40 L 820 70 L 840 40 L 860 70 L 880 40 L 900 70 L 920 40 L 940 70 L 960 40 L 980 70 L 1000 40 L 1020 70 L 1040 40 L 1060 70 L 1080 40" fill="none"/>
    
    <!-- Studio Fresnel Spotlights hanging -->
    <rect x="220" y="70" width="30" height="25" rx="3" fill="#1E293B"/>
    <polygon points="215,95 255,95 270,140 200,140" fill="#38BDF8" opacity="0.25"/>
    
    <rect x="440" y="70" width="30" height="25" rx="3" fill="#1E293B"/>
    <polygon points="435,95 475,95 500,160 410,160" fill="#38BDF8" opacity="0.3"/>
    
    <rect x="740" y="70" width="30" height="25" rx="3" fill="#1E293B"/>
    <polygon points="735,95 775,95 800,160 710,160" fill="#F59E0B" opacity="0.25"/>

    <rect x="940" y="70" width="30" height="25" rx="3" fill="#1E293B"/>
    <polygon points="935,95 975,95 1000,140 910,140" fill="#F59E0B" opacity="0.2"/>
  </g>

  <!-- Stage Platform & Floor Reflections -->
  <polygon points="120,560 1080,560 1180,680 20,680" fill="#0A0F1D" stroke="#1E293B" stroke-width="2"/>
  <ellipse cx="600" cy="560" rx="420" ry="24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Left Set: Tamizha Tamizha Talk Show LED Wall Simulation -->
  <g transform="translate(180, 160)">
    <rect width="380" height="240" rx="8" fill="url(#screenGrad1)" stroke="#38BDF8" stroke-width="2"/>
    <rect x="10" y="10" width="360" height="220" rx="4" fill="#070C1B"/>
    
    <!-- Talk Show Graphics -->
    <text x="190" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TAMIZHA TAMIZHA</text>
    <text x="190" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" text-anchor="middle" letter-spacing="1">FLAGSHIP DEBATE TALK SHOW // PRE-PRODUCTION</text>
    
    <!-- Debate Podium Silhouettes on Screen -->
    <rect x="50" y="110" width="45" height="85" rx="4" fill="#1E3A8A"/>
    <rect x="120" y="125" width="45" height="70" rx="4" fill="#1E3A8A"/>
    <circle cx="72" cy="95" r="14" fill="#38BDF8"/>
    <circle cx="142" cy="110" r="12" fill="#60A5FA"/>

    <circle cx="190" cy="120" r="18" fill="#F8FAFC" opacity="0.9"/>
    <rect x="175" y="145" width="30" height="60" rx="4" fill="#38BDF8"/>

    <rect x="235" y="125" width="45" height="70" rx="4" fill="#1E3A8A"/>
    <rect x="300" y="110" width="45" height="85" rx="4" fill="#1E3A8A"/>
    <circle cx="257" cy="110" r="12" fill="#60A5FA"/>
    <circle cx="322" cy="95" r="14" fill="#38BDF8"/>
    
    <!-- Lower Third Graphic Bar -->
    <rect x="20" y="195" width="340" height="24" rx="3" fill="#0B132B" stroke="#38BDF8" stroke-width="1"/>
    <text x="35" y="211" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">● SCRIPT: ROUND 02 [OPINIONS &amp; DIALOGUE] // TC: 00:23:14:02</text>
  </g>

  <!-- Right Set: Samayal Express Culinary Stage LED Screen Simulation -->
  <g transform="translate(640, 160)">
    <rect width="380" height="240" rx="8" fill="url(#culinaryGrad)" stroke="#F59E0B" stroke-width="2"/>
    <rect x="10" y="10" width="360" height="220" rx="4" fill="#0C0A09"/>
    
    <!-- Culinary Show Graphics -->
    <text x="190" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SAMAYAL EXPRESS</text>
    <text x="190" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B" text-anchor="middle" letter-spacing="1">CULINARY TELEVISION SERIES // MULTI-CAM STAGE</text>
    
    <!-- Kitchen Cooktop Silhouette & Chef Table -->
    <rect x="60" y="130" width="260" height="60" rx="4" fill="#292524" stroke="#78716C" stroke-width="1"/>
    <circle cx="120" cy="130" r="22" fill="#1C1917" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="190" cy="130" r="18" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="255" cy="130" r="22" fill="#1C1917" stroke="#F59E0B" stroke-width="2"/>
    
    <path d="M 175 110 Q 185 85 190 100 Q 195 85 205 110 Z" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Lower Third Culinary Bar -->
    <rect x="20" y="195" width="340" height="24" rx="3" fill="#1C1917" stroke="#F59E0B" stroke-width="1"/>
    <text x="35" y="211" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F59E0B">● CAM 03: OVERHEAD COOKING ANGLE // EPISODE 48</text>
  </g>

  <!-- Foreground Studio Pedestal Camera Rig 1 (Left) -->
  <g transform="translate(180, 420)">
    <!-- Base Pedestal -->
    <polygon points="60,240 10,260 110,260" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="240" x2="60" y2="100" stroke="#475569" stroke-width="12"/>
    <line x1="60" y1="240" x2="60" y2="100" stroke="#38BDF8" stroke-width="2" opacity="0.5"/>
    <!-- Pan/Tilt Head -->
    <rect x="35" y="80" width="50" height="24" rx="4" fill="#1E293B" stroke="#64748B"/>
    <!-- Studio Broadcast Camera Body -->
    <rect x="20" y="30" width="100" height="55" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Long Teleprompter Hood & Broadcast Lens -->
    <polygon points="120,35 170,20 170,90 120,80" fill="#070B14" stroke="#475569" stroke-width="1.5"/>
    <!-- Studio Tally Lamp (RED ON AIR) -->
    <rect x="55" y="18" width="30" height="12" rx="3" fill="#EF4444"/>
    <circle cx="70" cy="24" r="3" fill="#FFFFFF"/>
    <!-- Viewfinder Screen -->
    <rect x="-10" y="25" width="32" height="22" rx="2" fill="#000000" stroke="#38BDF8" stroke-width="1"/>
    <text x="6" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">LIVE</text>
    <text x="70" y="62" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">CAM 01</text>
  </g>

  <!-- Foreground Studio Pedestal Camera Rig 2 (Right) -->
  <g transform="translate(880, 420)">
    <!-- Base Pedestal -->
    <polygon points="60,240 10,260 110,260" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="240" x2="60" y2="100" stroke="#475569" stroke-width="12"/>
    <line x1="60" y1="240" x2="60" y2="100" stroke="#38BDF8" stroke-width="2" opacity="0.5"/>
    <!-- Pan/Tilt Head -->
    <rect x="35" y="80" width="50" height="24" rx="4" fill="#1E293B" stroke="#64748B"/>
    <!-- Studio Broadcast Camera Body -->
    <rect x="0" y="30" width="100" height="55" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Long Lens -->
    <polygon points="0,35 -50,20 -50,90 0,80" fill="#070B14" stroke="#475569" stroke-width="1.5"/>
    <!-- Studio Tally Lamp (RED ON AIR) -->
    <rect x="35" y="18" width="30" height="12" rx="3" fill="#EF4444"/>
    <circle cx="50" cy="24" r="3" fill="#FFFFFF"/>
    <!-- Viewfinder Screen -->
    <rect x="98" y="25" width="32" height="22" rx="2" fill="#000000" stroke="#38BDF8" stroke-width="1"/>
    <text x="114" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">C2</text>
    <text x="50" y="62" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">CAM 02</text>
  </g>

  <!-- Center Director Console & Script Desk -->
  <g transform="translate(460, 520)">
    <rect width="280" height="90" rx="8" fill="#0B132B" stroke="#334155" stroke-width="2"/>
    <!-- Audio / Video Faders -->
    <line x1="30" y1="30" x2="30" y2="70" stroke="#475569" stroke-width="4"/>
    <circle cx="30" cy="45" r="7" fill="#38BDF8"/>
    <line x1="60" y1="30" x2="60" y2="70" stroke="#475569" stroke-width="4"/>
    <circle cx="60" cy="55" r="7" fill="#38BDF8"/>
    <line x1="90" y1="30" x2="90" y2="70" stroke="#475569" stroke-width="4"/>
    <circle cx="90" cy="38" r="7" fill="#10B981"/>
    
    <!-- Script Binder -->
    <rect x="130" y="20" width="60" height="50" rx="3" fill="#F8FAFC"/>
    <line x1="140" y1="30" x2="180" y2="30" stroke="#0F172A" stroke-width="2"/>
    <line x1="140" y1="40" x2="175" y2="40" stroke="#0F172A" stroke-width="2"/>
    <line x1="140" y1="50" x2="170" y2="50" stroke="#EF4444" stroke-width="2"/>
    <text x="140" y="62" font-family="'JetBrains Mono', monospace" font-size="7" fill="#0F172A">SCRIPT V3</text>

    <!-- Director Talkback Mic -->
    <path d="M 230 70 Q 240 30 220 20" fill="none" stroke="#94A3B8" stroke-width="4"/>
    <circle cx="220" cy="18" r="6" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  </g>

  <!-- Editorial Watermark & Disclaimer Banner -->
  <g transform="translate(40, 630)">
    <rect width="1120" height="45" rx="6" fill="#070B14" fill-opacity="0.9" stroke="#1E293B" stroke-width="1"/>
    <text x="25" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8" font-weight="700" letter-spacing="1.5">PROJECT ARCHIVE: TAMIZHA TAMIZHA &amp; SAMAYAL EXPRESS</text>
    <text x="750" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" letter-spacing="1">[ ILLUSTRATIVE ARCHIVE CONCEPT // PRODUCTION STUDY ]</text>
  </g>
</svg>