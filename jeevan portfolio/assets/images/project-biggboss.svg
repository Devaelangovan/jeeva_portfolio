    <text x="40" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#EF4444" letter-spacing="2">REC ● LIVE BROADCAST</text>
    
    <text x="240" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">|</text>
    <text x="260" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="600">BIGG BOSS — SEASON 9</text>
    
    <text x="470" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">|</text>
    <text x="490" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">STORY EDITOR // CONTROL ROOM DESK</text>
    
