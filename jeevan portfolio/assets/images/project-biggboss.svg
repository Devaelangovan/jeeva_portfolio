      <text x="28" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF">FEED 1 [LIVING]</text>
      <rect x="145" y="40" width="90" height="24" rx="3" fill="#065F46" stroke="#10B981" stroke-width="1"/>
      <text x="152" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF">FEED 4 [CONFESS]</text>
