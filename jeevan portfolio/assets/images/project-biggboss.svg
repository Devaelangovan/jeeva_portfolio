      <rect x="255" y="35" width="26" height="20" rx="3" fill="#1E293B"/>
      <rect x="290" y="35" width="26" height="20" rx="3" fill="#1E293B"/>
      <rect x="325" y="35" width="26" height="20" rx="3" fill="#1E293B"/>

