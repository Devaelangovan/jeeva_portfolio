    <text x="25" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" font-weight="700" letter-spacing="1.5">PROJECT ARCHIVE: BIGG BOSS (SEASON 9) — CONTROL ROOM STORY EDITING</text>
