      <polygon points="304,32 316,32 310,40" fill="#38BDF8"/>
      <text x="20" y="108" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">IN: 08:35:10:00 | OUT: 08:48:22:15 | DURATION: 00:13:12:15 [READY FOR BROADCAST LOCK]</text>
