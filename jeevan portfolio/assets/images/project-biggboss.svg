      <line x1="240" y1="36" x2="240" y2="95" stroke="#EF4444" stroke-width="2"/>
      <line x1="385" y1="36" x2="385" y2="95" stroke="#10B981" stroke-width="2" stroke-dasharray="2 2"/>
      
      <!-- Playhead Red Marker -->
