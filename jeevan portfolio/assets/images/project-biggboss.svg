      <text x="248" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF">FEED 2 [CONFLICT CUT]</text>
      <rect x="385" y="40" width="140" height="24" rx="3" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1"/>
      <text x="395" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF">FEED 6 [REACTION]</text>
      
